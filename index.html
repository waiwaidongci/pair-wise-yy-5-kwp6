<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 16px 0 8px; }
    h3 { margin: 0; }
    h4 { margin: 14px 0 6px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    button.active-tool { background: #355b38; }
    input, textarea, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { resize: vertical; min-height: 52px; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; touch-action: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; font-size: 13px; }
    .dot { display: inline-block; width: 14px; height: 14px; border: 1px solid rgba(0,0,0,.15); border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }

    /* 提交栏与提示 */
    .submit-bar { margin-top: 12px; display: grid; gap: 6px; }
    .message { margin-top: 8px; font-size: 13px; font-weight: 700; min-height: 18px; }
    .msg-ok { color: #355b38; }
    .msg-err { color: #a03a2e; }
    .draft-meta { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: #5d5348; margin-bottom: 10px; }
    .badge { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .badge-dirty { background: #f6e0c9; color: #8d5524; }
    .badge-clean { background: #e2ece0; color: #355b38; }

    /* 版本列表 */
    .versions { margin-top: 18px; display: grid; gap: 10px; }
    .vcard { border: 1px solid #d9cdbc; border-radius: 8px; padding: 10px 12px; background: #fff; }
    .vcard.viewing { border-color: #355b38; box-shadow: 0 0 0 2px rgba(53,91,56,.18); }
    .vcard-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .seq { font-size: 12px; font-weight: 800; color: #fff; background: #72533c; border-radius: 999px; padding: 2px 9px; }
    .vname { font-weight: 800; }
    .vtime { margin-left: auto; color: #8c8175; font-size: 12px; }
    .vnote { margin: 6px 0; font-size: 13px; white-space: pre-wrap; }
    .vnote.muted { color: #a89d90; }
    .vmeta { font-size: 12px; color: #76695e; }
    .vusage { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; background: #f3ead9; border-radius: 999px; padding: 2px 9px; }
    .chip .dot { width: 11px; height: 11px; margin: 0; }
    .vactions { display: flex; gap: 8px; }
    .vactions button { padding: 7px 10px; font-size: 13px; }
    .empty { font-size: 13px; color: #8c8175; }

    /* 只读版本弹层 */
    .modal { display: none; position: fixed; inset: 0; background: rgba(31,27,22,.45); z-index: 10; padding: 24px; overflow: auto; }
    .modal.open { display: block; }
    .modal-body { background: #fffaf2; max-width: 760px; margin: 0 auto; border-radius: 10px; padding: 18px; border: 1px solid #d9cdbc; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .modal-head small { font-weight: 400; color: #8c8175; font-size: 13px; margin-left: 8px; }
    .frozen-grid { display: grid; gap: 2px; border: 6px solid #72533c; background: #72533c; max-width: 480px; }
    .frozen { border-radius: 1px; }
    .frozen-stats { max-width: 480px; }

    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，提交打样即冻结版本，旧配色随时可回溯。</div></div>
    <div class="toolbar"><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel">
      <div class="draft-meta" id="draftMeta"></div>
      <div class="grid" id="grid"></div>
      <form class="submit-bar" id="submitForm" onsubmit="return false">
        <label for="verName">本次打样名称（重名会被拒绝）</label>
        <input id="verName" type="text" maxlength="40" placeholder="例如：缠枝莲-靛青底-v3">
        <label for="verNote">备注（随版本一起冻结）</label>
        <textarea id="verNote" maxlength="300" placeholder="用线比例、师傅意见、需要复色的位置……"></textarea>
        <button id="submitBtn">提交打样（冻结当前网格、用量与备注）</button>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </form>
      <h2>已提交版本 <small style="color:#8c8175;font-weight:400">按提交序号排列，内容不可修改</small></h2>
      <div class="versions" id="versionList"></div>
    </section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。编辑只改工作稿，不影响已提交版本。</p>
      <h2>用色统计（当前工作稿）</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <div class="modal" id="versionModal">
    <div class="modal-body" id="modalBody"></div>
  </div>

  <!-- 三个业务文件：存档 / 状态管理 / 界面交互 -->
  <script src="js/archive.js"></script>
  <script src="js/workspace.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
