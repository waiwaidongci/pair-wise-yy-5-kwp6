<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #71675c; }
    input, select, textarea { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { resize: vertical; min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 260px 1fr 300px 300px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .dot { display: inline-block; width: 12px; height: 12px; border: 1px solid rgba(0,0,0,.25); vertical-align: -1px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .status { font-size: 13px; margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; }
    .status.dirty { background: #f6e3d3; color: #7c4a1d; }
    .status.clean { background: #e4ece1; color: #355b38; }
    .message { margin: 8px 0 0; font-size: 13px; font-weight: 700; min-height: 18px; }
    .message.error { color: #a03a2e; }
    .message.success { color: #355b38; }
    .message.info { color: #5d5144; }
    .versions { display: grid; gap: 10px; max-height: 75vh; overflow: auto; }
    .version { border: 1px solid #d9cdbc; border-radius: 8px; padding: 10px; background: #fff; }
    .version.current-base { border-color: #8d3e37; box-shadow: 0 0 0 2px rgba(141,62,55,.15); }
    .version header { display: flex; align-items: center; gap: 8px; padding: 0; background: none; border: 0; flex-wrap: wrap; }
    .vseq { font-size: 12px; color: #fff; background: #71675c; border-radius: 99px; padding: 2px 8px; }
    .vname { font-size: 15px; }
    .tag { font-size: 11px; color: #8d3e37; border: 1px solid #8d3e37; border-radius: 99px; padding: 1px 7px; }
    .version time { margin-left: auto; font-size: 12px; color: #8a7c6e; }
    .vmeta { font-size: 12px; color: #8a7c6e; margin: 6px 0; }
    .frozen-preview { margin: 6px 0; }
    .usage { display: flex; flex-wrap: wrap; gap: 6px; }
    .usage-pill { font-size: 12px; background: #f3efe7; border-radius: 99px; padding: 2px 8px; display: inline-flex; gap: 4px; align-items: center; }
    .vnotes { font-size: 13px; margin: 8px 0; white-space: pre-wrap; }
    .vnotes.empty { color: #a99c8d; }
    .hint { font-size: 13px; color: #8a7c6e; }
    .fork-btn { width: 100%; margin-top: 8px; }
    @media (max-width: 1200px) { .app { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 760px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，统计色线用量；提交即冻结，旧配色可随时续作。</div></div>
    <div class="toolbar"><button id="exportBtn" class="secondary">导出全部版本JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel">
      <p class="status" id="draftStatus"></p>
      <div class="grid" id="grid"></div>
      <div class="toolbar" style="margin-top:10px">
        <button id="undoBtn" class="secondary">撤销</button>
        <button id="redoBtn" class="secondary">重做</button>
      </div>
      <p class="hint">点击填色，按住拖动可连续填色。工作稿改动会自动暂存在本机。</p>
    </section>
    <aside class="panel">
      <h2>提交打样</h2>
      <label>版本名称（不可与已有版本重名）</label>
      <input id="commitName" type="text" maxlength="40" placeholder="例如：秋香地缠枝纹-初版">
      <label>备注（随这一版一起冻结）</label>
      <textarea id="notes" placeholder="配线说明、师傅意见、经密调整等"></textarea>
      <button id="commitBtn" style="width:100%;margin-top:10px">提交打样（冻结当前稿）</button>
      <p class="message" id="commitMessage"></p>
      <h2>用色统计（工作稿实时）</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
    <aside class="panel">
      <h2>版本历史</h2>
      <div class="versions" id="versions"></div>
    </aside>
  </main>
  <script src="archive.js"></script>
  <script src="state.js"></script>
  <script src="app.js"></script>
</body>
</html>
